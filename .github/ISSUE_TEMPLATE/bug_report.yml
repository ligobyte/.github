name: Bug report
description: Something is broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The more concrete you are, the faster this gets fixed.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A concise description of the actual behavior.
      placeholder: "credits:grant returned 403 despite the SA being on the allowlist..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: The behavior you were expecting instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands or clicks. Include any relevant flags or env values.
      placeholder: |
        1. `mise credits:grant -- <uid> 50 "test" dev`
        2. Wait for HTTP response
        3. Observe 403 with HTML body
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Service name + version + env (dev/prod/local). E.g. `sportsdj-core@0.2.2 dev`.
      placeholder: sportsdj-core@0.2.2 dev
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, error output, or screenshots
      description: Paste relevant output. Redact anything sensitive. Wrap in triple backticks.
      render: shell

  - type: textarea
    id: links
    attributes:
      label: Related links
      description: PR that introduced the change, related issue, Slack thread, etc. (Optional.)
